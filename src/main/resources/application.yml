server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:zhaobiao_admin}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expire-seconds: 7200
  bootstrap:
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  file:
    type: ${APP_FILE_TYPE:local}
    storage-path: ${APP_FILE_STORAGE_PATH:./.uploads/files}
    temp-path: ${APP_FILE_TEMP_PATH:./.uploads/tmp}
    oss-bucket: ${APP_FILE_OSS_BUCKET:}
    oss-endpoint: ${APP_FILE_OSS_ENDPOINT:}
    oss-access-key-id: ${APP_FILE_OSS_ACCESS_KEY_ID:}
    oss-access-key-secret: ${APP_FILE_OSS_ACCESS_KEY_SECRET:}
    oss-credential-mode: ${APP_FILE_OSS_CREDENTIAL_MODE:access-key}
    oss-role-name: ${APP_FILE_OSS_ROLE_NAME:}
    oss-key-prefix: ${APP_FILE_OSS_KEY_PREFIX:zb/files}

logging:
  file:
    name: ${APP_LOG_PATH:./logs}/zhaobiao-admin.log
  level:
    root: ${APP_ROOT_LOG_LEVEL:INFO}
    com.zhaobiao.admin: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${APP_SQL_LOG_LEVEL:WARN}
  logback:
    rollingpolicy:
      file-name-pattern: ${APP_LOG_PATH:./logs}/zhaobiao-admin.log.%d{yyyy-MM-dd}.%i.gz
      max-file-size: ${APP_LOG_MAX_FILE_SIZE:50MB}
      max-history: ${APP_LOG_MAX_HISTORY:60}
      total-size-cap: ${APP_LOG_TOTAL_SIZE_CAP:2GB}
